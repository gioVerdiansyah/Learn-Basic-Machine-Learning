<!DOCTYPE html>
<!-- Created By CodingLab - www.codinglabweb.com -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Diamond Price Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
      }

      .container {
        max-width: 1000px;
        width: 100%;
        background-color: #fff;
        padding: 25px 30px;
        border-radius: 5px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
      }

      .container .title {
        text-align: center;
        font-style: bold;
        font-size: 25px;
        font-weight: 500;
        position: relative;
        margin-bottom: 50px;
      }

      .content {
        display: flex;
      }

      .content img {
        width: 300px;
        margin-bottom: 15%;
      }

      .content form .user-input {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        margin: 20px 0 12px 0;
      }

      form .user-input .input-box {
        margin-bottom: 15px;
        width: calc(100% / 2 - 20px);
      }

      form .input-box span.details {
        display: block;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .user-input .input-box input {
        height: 45px;
        width: 100%;
        outline: none;
        font-size: 16px;
        border-radius: 5px;
        padding-left: 15px;
        border: 1px solid #ccc;
        border-bottom-width: 2px;
      }

      form .button {
        height: 45px;
        margin: 35px 0;
      }

      form .button input {
        height: 100%;
        width: 100%;
        border-radius: 5px;
        border: none;
        color: #fff;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #71b7e6, #9b59b6);
      }

      form .button input:hover {
        background: linear-gradient(-135deg, #71b7e6, #9b59b6);
      }

      p {
        font-size: 18px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Diamond Price Prediction</h1>
      <div class="content">
        <img
          src="https://img.pikbest.com/origin/10/06/03/17zpIkbEsTZrB.png!sw800"
        />
        <form action="{{url_for('predict')}}" method="post">
          <div class="user-input">
            <div class="input-box">
              <span class="details">Weight (0.2 to 5.01) of the diamond</span
              ><br />
              <input
                type="number"
                step="0.01"
                name="carat"
                placeholder="Enter the carat value"
                required
              />
            </div>
            <div class="input-box">
              <span class="details">Color</span>
              <input
                type="text"
                step="0.01"
                name="color"
                placeholder="enter diamond color"
                required
              />
            </div>
            <div class="input-box">
              <span class="details">Table </span>
              <input
                type="text"
                step="1"
                name="table"
                placeholder="enter Table"
                required
              />
            </div>
            <div class="input-box">
              <span class="details">Length(0 to 10.74) in mm</span>
              <input
                type="text"
                step="0.01"
                name="x"
                placeholder="enter the length of the diamond"
                required
              />
            </div>
            <div class="input-box">
              <span class="details">Width(0 to 58.9) in mm</span>
              <input
                type="text"
                step="0.01"
                name="y"
                placeholder="Enter the width of the diamond"
                required
              />
            </div>
            <div class="input-box">
              <span class="details">Z(0 to 31.8) in mm</span>
              <input
                type="text"
                step="0.01"
                name="z"
                placeholder="Enter the depth of the diamond"
                required
              />
            </div>
          </div>
          <div class="button">
            <input type="submit" value="predict" /><br /><br />
            <p>{{output}}</p>
          </div>
          <br />
        </form>
      </div>
    </div>
  </body>
</html>
